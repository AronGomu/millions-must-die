[workspace]
members = [".", "crates/mmd-engine", "tools/mmd-lab", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT-0"

[workspace.dependencies]
clap = { version = "4.5.53", features = ["derive"] }
hex = "0.4.3"
mmd-engine = { path = "crates/mmd-engine" }
png = "0.18.1"
ron = "0.10.1"
# Pinned in T6 (third_party/versions.toml). Exact; no caret floats.
sdl3 = { version = "=0.18.4", default-features = false }
sdl3-sys = { version = "=0.6.7", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.12"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[package]
name = "millions_must_die"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Millions Must Die phase-0 technical prototype app"
publish = false

[[bin]]
name = "millions_must_die"
path = "src/main.rs"

[dependencies]
clap.workspace = true
mmd-engine.workspace = true
serde_json.workspace = true
sdl3 = { workspace = true }

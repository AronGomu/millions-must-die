[package]
name = "mmd-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Millions Must Die engine library"
publish = false
build = "build.rs"

[features]
default = ["gpu", "testkit"]
# Full renderer path (links native SDL3).
gpu = []
# Deterministic headless test harness (T29). On by default because every
# integration test in `tests/` consumes it as an external crate, where
# `#[cfg(test)]` is invisible. Pure Rust, no extra dependencies. Exclude from a
# shipping build with `--no-default-features --features gpu`.
testkit = []
# Compile-only SDL3 GPU API surface check (no native link). T6 leftover.
gpu-api-spike = []

[dependencies]
hex.workspace = true
png.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
sdl3 = { workspace = true, features = ["test-mode"] }
sdl3-sys = { workspace = true, features = ["use-pkg-config"] }

[dev-dependencies]
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true
